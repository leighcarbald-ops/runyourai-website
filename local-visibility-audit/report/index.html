<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Local Visibility Audit | RunYourAI</title><link rel="stylesheet" href="../../styles.css"><style>main{min-height:100vh;display:grid;place-items:center;padding:40px 20px}.card{max-width:680px;width:100%;padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.03)}.muted{color:var(--muted)}</style></head><body><main><section class="card"><div class="eyebrow">RunYourAI Local Visibility Audit</div><h1 id="title">Preparing your report…</h1><p id="message" class="muted">Payment was received. We’re securely unlocking the exact audit you scanned before checkout.</p><button id="retry" class="btn btn-primary" style="display:none">Check Again</button></section></main><script>const API='https://runyourai-local-visibility-audit.leighh-8d4.workers.dev/paid-report';const params=new URLSearchParams(location.search),auditId=params.get('auditId')||sessionStorage.getItem('runyouraiAuditId'),token=sessionStorage.getItem('runyouraiAuditToken');const title=document.getElementById('title'),message=document.getElementById('message'),retry=document.getElementById('retry');async function load(){retry.style.display='none';if(!auditId||!token){title.textContent='Open this report from the device used for the scan';message.textContent='The secure audit access token is missing from this browser session. Your payment is not lost; contact RunYourAI with the email used at checkout.';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auditId,token})});if(r.status===202){title.textContent='Payment confirmed — report is processing';message.textContent='Stripe confirmation and report generation can take a few seconds. Tap Check Again.';retry.style.display='inline-flex';return}if(!r.ok){let b={};try{b=await r.json()}catch{}throw new Error(b.error||'Report access could not be verified.')}const html=await r.text();document.open();document.write(html);document.close()}catch(e){title.textContent='We could not open the report yet';message.textContent=e.message||'Please try again.';retry.style.display='inline-flex'}}retry.addEventListener('click',load);load();</script></body></html>
