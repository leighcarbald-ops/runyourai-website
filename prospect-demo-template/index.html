<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Prospect AI Support Demo Template</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#111}.page{position:fixed;inset:0;overflow:hidden}.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#eee}.badge{position:absolute;z-index:3;top:12px;left:50%;transform:translateX(-50%);background:#16101f;color:#fff;border:1px solid #a78bfa;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:900;box-shadow:0 7px 24px #0005;white-space:nowrap}.widget{position:absolute;z-index:5;right:22px;bottom:22px;width:min(570px,calc(100vw - 44px));height:min(700px,calc(100vh - 44px));background:#fff;color:#171721;border-radius:24px;overflow:hidden;box-shadow:0 25px 100px #0008,0 0 0 4px #7c3aed55;display:flex;flex-direction:column}.head{padding:20px 22px;background:#17121f;color:#fff}.head strong{font-size:21px;display:block}.head span{font-size:13px;color:#c4b5fd}.body{flex:1;overflow:auto;padding:18px;background:#f7f7fb}.msg{max-width:89%;padding:12px 14px;border-radius:15px;margin:9px 0;line-height:1.45}.bot{background:#ece9f5}.user{background:#5b21b6;color:#fff;margin-left:auto}.prompts{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff}.prompts button{flex:0 0 auto;border:1px solid #ddd6fe;background:#faf5ff;color:#4c1d95;border-radius:999px;padding:9px 11px;font:inherit;font-size:13px;white-space:nowrap}.form{display:flex;gap:8px;padding:13px;border-top:1px solid #e5e7eb}.form input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:11px;padding:13px;font:inherit}.form button{border:0;border-radius:11px;background:#7c3aed;color:#fff;font-weight:850;padding:0 16px}.fine{padding:8px 14px;background:#fafafa;color:#6b7280;font-size:11px}@media(max-width:700px){.widget{right:8px;bottom:8px;width:calc(100vw - 16px);height:min(76vh,680px);border-radius:20px}.badge{top:6px;font-size:9px}.head{padding:15px 16px}.body{padding:13px}}</style></head><body><main class="page"><img id="backdrop" class="backdrop" src="homepage.jpg" alt="Business homepage preview"><div class="badge">PERSONALIZED 24/7 AI SUPPORT PREVIEW</div><aside class="widget"><div class="head"><strong id="business">BUSINESS_NAME Support</strong><span>24/7 AI Customer Assistant</span></div><div id="chat" class="body"><div class="msg bot">GREETING_TEXT</div></div><div id="prompts" class="prompts"></div><form id="form" class="form"><input id="input" autocomplete="off" placeholder="Ask a customer question"><button>Send</button></form><div class="fine">RunYourAI personalized demonstration. Information is preloaded from the business's public website.</div></aside></main><script>const CONFIG={business:'BUSINESS_NAME',api:'https://runyourai-customer-support.leighh-8d4.workers.dev/api/demo/chat',questions:['QUESTION_1','QUESTION_2','QUESTION_3','QUESTION_4','QUESTION_5','QUESTION_6','QUESTION_7','QUESTION_8'],knowledge:[]};const chat=document.getElementById('chat'),input=document.getElementById('input'),prompts=document.getElementById('prompts');CONFIG.questions.filter(q=>q&&!q.startsWith('QUESTION_')).forEach(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>{input.value=q;input.focus()};prompts.appendChild(b)});function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=input.value.trim();if(!m)return;add(m,'user');input.value='';try{const r=await fetch(CONFIG.api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,knowledge:CONFIG.knowledge})}),d=await r.json();add(d.message||'I could not answer that from the preloaded business information.','bot')}catch{add('The demo assistant is temporarily unavailable.','bot')}};</script></body></html>
